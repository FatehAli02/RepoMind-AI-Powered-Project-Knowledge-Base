
services:
  db:
    image: pgvector/pgvector:pg16  
    container_name: repomind_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: repomind_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
volumes:
  pgdata: